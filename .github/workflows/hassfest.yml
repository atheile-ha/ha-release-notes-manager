name: Hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    # Zunächst nur zur Information: Die Meldungen erst sichten, dann zur Pflicht machen
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
