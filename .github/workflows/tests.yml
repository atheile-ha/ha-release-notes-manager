name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python-Tests und Konsistenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax der Integration prüfen
        run: python -m compileall -q custom_components

      - name: Tests installieren
        run: pip install -r requirements-test.txt

      - name: Tests ausführen
        run: python -m pytest -q

  frontend:
    name: Frontend-Tests und Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Karten-Bundle bauen
        run: npm run build

      - name: Prüfen, dass das eingecheckte Bundle zum Quellcode passt
        working-directory: .
        run: |
          if ! git diff --exit-code -- custom_components/release_notes_manager/frontend/release-notes-card.js; then
            echo "::error::release-notes-card.js ist nicht aktuell. Lokal 'npm run build' im Ordner frontend ausführen und das Bundle mit einchecken."
            exit 1
          fi
