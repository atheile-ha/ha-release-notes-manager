<!DOCTYPE html>
<html lang="de">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta id="version-meta" name="version" content="0.7.0">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Assistant Release Notes Manager - Admin v0.7.0</title>
  <style>
    /* Farben: Standardwerte des HA-Themes (hell/dunkel). Im HA-iframe überschreibt
       applyTheme() sie mit den Werten des aktiven HA-Themes. */
    :root {
      --primary-background-color: #fafafa;
      --card-background-color: #ffffff;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --divider-color: rgba(0, 0, 0, 0.12);
      --primary-color: #03a9f4;
      --text-primary-color: #ffffff;
      --success-color: #43a047;
      --warning-color: #ffa600;
      --error-color: #db4437;
      --info-color: #039be5;
      --rn-card: var(--ha-card-background, var(--card-background-color));
      --rn-radius: var(--ha-card-border-radius, 12px);
      --rn-shadow: var(--ha-card-box-shadow, 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 1px 5px 0 rgba(0, 0, 0, 0.12), 0 3px 1px -2px rgba(0, 0, 0, 0.2));
      --rn-card-border: transparent;
      --rn-head-bg: color-mix(in srgb, var(--primary-text-color) 4%, transparent);
      --rn-input-border: color-mix(in srgb, var(--primary-text-color) 28%, transparent);
      --rn-scrim: rgba(0, 0, 0, 0.32);
      --rn-success-text: color-mix(in srgb, var(--success-color) 65%, var(--primary-text-color));

      /* Kategorie-Farben (hell) - Hintergrund/Schrift, Kontrast >= 4,5:1 */
      --lbl-white-bg: #ffffff; --lbl-white-fg: #202124; --lbl-white-bd: #bfc3c9;
      --lbl-gray-bg: #e8eaed; --lbl-gray-fg: #3c4043;
      --lbl-black-bg: #2b2d31; --lbl-black-fg: #ffffff;
      --lbl-red-bg: #fde2e1; --lbl-red-fg: #a3221b;
      --lbl-orange-bg: #ffe8d4; --lbl-orange-fg: #9a3d0a;
      --lbl-yellow-bg: #fdf1c4; --lbl-yellow-fg: #6f4a00;
      --lbl-green-bg: #dcf3e3; --lbl-green-fg: #1b6b36;
      --lbl-blue-light-bg: #d6e9fc; --lbl-blue-light-fg: #144f8a;
      --lbl-blue-dark-bg: #1f5fbf; --lbl-blue-dark-fg: #ffffff;
      --lbl-purple-bg: #efe3fb; --lbl-purple-fg: #6a2ba3;
      --lbl-pink-bg: #fce1ee; --lbl-pink-fg: #9b1d57;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary-background-color: #111111;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(225, 225, 225, 0.12);
        --rn-card-border: var(--divider-color);
        --rn-scrim: rgba(0, 0, 0, 0.6);
        --lbl-white-bg: transparent; --lbl-white-fg: #f1f3f4; --lbl-white-bd: #6b6f76;
        --lbl-gray-bg: #3a3d42; --lbl-gray-fg: #dfe1e5;
        --lbl-black-bg: #e6e7e9; --lbl-black-fg: #141516;
        --lbl-red-bg: #4a1f1f; --lbl-red-fg: #ffb3ad;
        --lbl-orange-bg: #4a2a14; --lbl-orange-fg: #ffc28f;
        --lbl-yellow-bg: #463a10; --lbl-yellow-fg: #f5d66b;
        --lbl-green-bg: #173d26; --lbl-green-fg: #8fdcaa;
        --lbl-blue-light-bg: #18344f; --lbl-blue-light-fg: #9ccbfa;
        --lbl-blue-dark-bg: #2f6fd0; --lbl-blue-dark-fg: #ffffff;
        --lbl-purple-bg: #362151; --lbl-purple-fg: #d7b8fb;
        --lbl-pink-bg: #4a1b33; --lbl-pink-fg: #ffb0d4;
        color-scheme: dark;
      }
    }
    /* Gleiche Werte wie oben, damit der manuelle Schalter / das HA-Theme in beide Richtungen greift */
    :root[data-theme="dark"] {
      --primary-background-color: #111111;
      --card-background-color: #1c1c1c;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --divider-color: rgba(225, 225, 225, 0.12);
      --rn-card-border: var(--divider-color);
      --rn-scrim: rgba(0, 0, 0, 0.6);
      --lbl-white-bg: transparent; --lbl-white-fg: #f1f3f4; --lbl-white-bd: #6b6f76;
      --lbl-gray-bg: #3a3d42; --lbl-gray-fg: #dfe1e5;
      --lbl-black-bg: #e6e7e9; --lbl-black-fg: #141516;
      --lbl-red-bg: #4a1f1f; --lbl-red-fg: #ffb3ad;
      --lbl-orange-bg: #4a2a14; --lbl-orange-fg: #ffc28f;
      --lbl-yellow-bg: #463a10; --lbl-yellow-fg: #f5d66b;
      --lbl-green-bg: #173d26; --lbl-green-fg: #8fdcaa;
      --lbl-blue-light-bg: #18344f; --lbl-blue-light-fg: #9ccbfa;
      --lbl-blue-dark-bg: #2f6fd0; --lbl-blue-dark-fg: #ffffff;
      --lbl-purple-bg: #362151; --lbl-purple-fg: #d7b8fb;
      --lbl-pink-bg: #4a1b33; --lbl-pink-fg: #ffb0d4;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--primary-font-family, Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, sans-serif); font-size: 14px; line-height: 1.45; background: var(--primary-background-color); color: var(--primary-text-color); }

    /* Layout-Utilities */
    .min-h-screen { min-height: 100vh; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
    .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
    .pt-4 { padding-top: 1rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .flex { display: flex; }
    .flex-1 { flex: 1; min-width: 0; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-stretch { align-items: stretch; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .rounded { border-radius: 8px; }
    .border { border: 1px solid var(--divider-color); }
    .border-t { border-top: 1px solid var(--divider-color); }
    .border-b { border-bottom: 1px solid var(--divider-color); }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.1rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-medium { font-weight: 500; }
    .font-mono { font-family: ui-monospace, Consolas, monospace; }
    .italic { font-style: italic; }
    .line-through { text-decoration: line-through; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .min-w-12 { min-width: 3rem; }
    .block { display: block; }
    .hidden { display: none; }
    .cursor-pointer { cursor: pointer; }
    .preserve-linebreaks { white-space: pre-wrap; word-wrap: break-word; }
    .space-y-2 > * + * { margin-top: 0.5rem; }
    .space-y-3 > * + * { margin-top: 0.75rem; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .text-gray-500, .text-gray-600, .text-gray-700 { color: var(--secondary-text-color); }
    .text-green-700, .text-green-800 { color: var(--rn-success-text); }

    /* Seite */
    .app { max-width: 72rem; margin: 0 auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--rn-card); border-radius: var(--rn-radius); box-shadow: var(--rn-shadow); border: 1px solid var(--rn-card-border); overflow: hidden; }
    .toolbar { padding: 0.875rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .toolbar-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .header-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ha-logo { height: 32px; width: 32px; flex-shrink: 0; color: var(--primary-color); }
    .app-title { font-size: 1.25rem; font-weight: 500; }
    .save-status { font-size: 0.8rem; color: var(--secondary-text-color); min-height: 1em; }
    .filters { display: flex; gap: 0.5rem; padding: 0 1rem 0.875rem; flex-wrap: wrap; }
    .filters input { flex: 1 1 12rem; min-width: 0; }
    .settings-panel { border-top: 1px solid var(--divider-color); border-bottom: 1px solid var(--divider-color); padding: 1rem; margin-bottom: 0.875rem; background: var(--rn-head-bg); }
    .settings-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .settings-row + .settings-row { margin-top: 0.75rem; }
    .version-footer { position: fixed; bottom: 10px; left: 10px; font-size: 11px; color: var(--secondary-text-color); font-family: ui-monospace, Consolas, monospace; z-index: 1000; }

    /* Eingaben und Buttons (Stil wie in ha_ev-charge-record) */
    input, select, textarea { font: inherit; font-size: 0.875rem; color: var(--primary-text-color); background: var(--rn-card); border: 1px solid var(--rn-input-border); border-radius: 8px; }
    input, select { padding: 0.45rem 0.65rem; }
    textarea { resize: vertical; padding: 0.45rem 0.65rem; }
    input[type="checkbox"], input[type="range"] { padding: 0; accent-color: var(--primary-color); }
    input::placeholder, textarea::placeholder { color: var(--secondary-text-color); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 20%, transparent); }
    button { font: inherit; font-size: 0.875rem; cursor: pointer; transition: background-color 0.15s, color 0.15s, border-color 0.15s; }
    button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }
    .btn { padding: 0.4rem 0.9rem; background: transparent; border: 1px solid var(--primary-color); border-radius: 8px; color: var(--primary-color); white-space: nowrap; }
    .btn:hover { background: color-mix(in srgb, var(--primary-color) 10%, transparent); }
    .btn-sm { padding: 0.25rem 0.7rem; font-size: 0.8rem; }
    .btn-primary { background: var(--primary-color); color: var(--text-primary-color); font-weight: 500; }
    .btn-primary:hover { background: color-mix(in srgb, var(--primary-color) 85%, #000); }
    .btn-danger { border-color: var(--error-color); color: var(--error-color); }
    .btn-danger:hover { background: color-mix(in srgb, var(--error-color) 10%, transparent); }
    .btn-success { border-color: var(--success-color); color: var(--rn-success-text); }
    .btn-success:hover { background: color-mix(in srgb, var(--success-color) 12%, transparent); }
    .btn-icon { width: 34px; height: 34px; flex-shrink: 0; display: inline-grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--secondary-text-color); font-size: 1.1rem; line-height: 1; }
    .btn-icon:hover { background: var(--rn-head-bg); color: var(--primary-text-color); }
    .btn-icon svg { width: 20px; height: 20px; }
    .btn-icon-danger:hover { color: var(--error-color); }
    .seg { display: inline-flex; border: 1px solid var(--rn-input-border); border-radius: 8px; padding: 2px; gap: 2px; }
    .seg button { padding: 0.3rem 0.8rem; border: 0; border-radius: 6px; background: transparent; color: var(--secondary-text-color); }
    .seg button[aria-pressed="true"] { background: var(--primary-color); color: var(--text-primary-color); }

    /* Chips (Zusammenfassung, Status) */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 500; line-height: 1.3; white-space: nowrap; background: color-mix(in srgb, var(--chip-color, var(--primary-color)) 20%, transparent); color: var(--primary-text-color); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color); }
    .chip-features { --chip-color: var(--success-color); }
    .chip-changes { --chip-color: var(--info-color); }
    .chip-issues { --chip-color: var(--warning-color); }
    .chip-done { --chip-color: var(--success-color); }
    .chip-now { --chip-color: var(--primary-color); }

    /* Kategorie-Labels: Farbe kommt über die Farb-ID (.lbl-<id>) aus den Theme-Tokens */
    .lbl { display: inline-block; width: 8rem; flex-shrink: 0; text-align: center; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; line-height: 1.35; background: var(--lbl-bg); color: var(--lbl-fg); border: 1px solid var(--lbl-bd, transparent); hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
    .lbl-white { --lbl-bg: var(--lbl-white-bg); --lbl-fg: var(--lbl-white-fg); --lbl-bd: var(--lbl-white-bd); }
    .lbl-gray { --lbl-bg: var(--lbl-gray-bg); --lbl-fg: var(--lbl-gray-fg); }
    .lbl-black { --lbl-bg: var(--lbl-black-bg); --lbl-fg: var(--lbl-black-fg); }
    .lbl-red { --lbl-bg: var(--lbl-red-bg); --lbl-fg: var(--lbl-red-fg); }
    .lbl-orange { --lbl-bg: var(--lbl-orange-bg); --lbl-fg: var(--lbl-orange-fg); }
    .lbl-yellow { --lbl-bg: var(--lbl-yellow-bg); --lbl-fg: var(--lbl-yellow-fg); }
    .lbl-green { --lbl-bg: var(--lbl-green-bg); --lbl-fg: var(--lbl-green-fg); }
    .lbl-blue-light { --lbl-bg: var(--lbl-blue-light-bg); --lbl-fg: var(--lbl-blue-light-fg); }
    .lbl-blue-dark { --lbl-bg: var(--lbl-blue-dark-bg); --lbl-fg: var(--lbl-blue-dark-fg); }
    .lbl-purple { --lbl-bg: var(--lbl-purple-bg); --lbl-fg: var(--lbl-purple-fg); }
    .lbl-pink { --lbl-bg: var(--lbl-pink-bg); --lbl-fg: var(--lbl-pink-fg); }
    .lbl-pick { cursor: pointer; }
    .lbl-pick:hover { filter: brightness(0.95); }
    .color-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: 0.5rem; padding: 0.75rem; margin: -0.25rem 0 0.5rem; border: 1px solid var(--divider-color); border-radius: 10px; background: var(--rn-head-bg); }
    .color-picker button { padding: 0; border: 0; background: none; border-radius: 6px; }
    .color-picker button[aria-pressed="true"] .lbl { outline: 2px solid var(--primary-color); outline-offset: 2px; }

    /* Release-Karten */
    .releases { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .release-head { position: relative; padding: 0.875rem 2.75rem 0.875rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; cursor: pointer; }
    .release-head::after { content: ""; position: absolute; top: 50%; right: 18px; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid var(--secondary-text-color); border-bottom: 2px solid var(--secondary-text-color); transform: rotate(45deg); }
    .release.open .release-head::after { margin-top: -2px; transform: rotate(-135deg); }
    .release-title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 0.75rem; }
    .release-title { font-size: 1.1rem; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
    .release-meta { display: flex; align-items: center; gap: 0.25rem; }
    .release-date { color: var(--secondary-text-color); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .release-body { border-top: 1px solid var(--divider-color); padding: 0.375rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .group-title, .section-title { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--secondary-text-color); }
    .group-title { margin: 0.625rem 0 0.25rem; }
    .items { list-style: none; }
    .items > li + li { border-top: 1px solid var(--divider-color); }
    .items.issues { display: flex; flex-direction: column; gap: 0.5rem; }
    .items.issues > li + li { border-top: 0; }
    .item { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.5rem 0; }
    .item.issue { padding: 0.5rem 0.625rem; border-radius: 10px; background: color-mix(in srgb, var(--warning-color) 10%, var(--rn-card)); border: 1px solid color-mix(in srgb, var(--warning-color) 40%, transparent); }
    .item-main { flex: 1; min-width: 0; }
    .item-title { font-weight: 500; overflow-wrap: anywhere; }
    .item-toggle { position: relative; display: block; width: 100%; text-align: left; padding: 0 1.75rem 0 0; border: 0; background: none; color: inherit; font-weight: 500; font-size: inherit; overflow-wrap: anywhere; }
    .item-toggle::after { content: ""; position: absolute; top: 50%; right: 6px; width: 6px; height: 6px; margin-top: -5px; border-right: 2px solid var(--secondary-text-color); border-bottom: 2px solid var(--secondary-text-color); transform: rotate(45deg); }
    .item-toggle.open::after { margin-top: -1px; transform: rotate(-135deg); }
    .item-details { margin-top: 0.375rem; padding: 0.5rem 0.75rem; border-radius: 8px; background: var(--rn-head-bg); color: var(--secondary-text-color); font-size: 0.875rem; overflow-wrap: anywhere; }
    .item-resolution { margin-top: 0.25rem; color: var(--secondary-text-color); font-size: 0.875rem; }
    .item .chips { margin-top: 0.25rem; }
    .note { padding: 0.625rem 0.75rem; border-radius: 8px; background: var(--rn-head-bg); color: var(--secondary-text-color); font-size: 0.875rem; }
    .more { text-align: center; padding: 0.25rem 0 0.5rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--secondary-text-color); }
    .empty-title { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--primary-text-color); }

    /* Dialoge */
    .modal { position: fixed; inset: 0; background: var(--rn-scrim); display: none; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: var(--rn-card); color: var(--primary-text-color); border-radius: var(--rn-radius); border: 1px solid var(--rn-card-border); max-width: 56rem; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); }
    .dialog-title { font-size: 1.25rem; font-weight: 500; }
    .section-title { margin: 0; align-self: center; }
    .edit-row { border: 1px solid var(--divider-color); border-radius: 10px; padding: 0.625rem; margin-bottom: 0.75rem; background: var(--rn-head-bg); }
    .edit-row-issue { background: color-mix(in srgb, var(--warning-color) 10%, var(--rn-card)); border-color: color-mix(in srgb, var(--warning-color) 40%, transparent); }
    .edit-row-done { background: color-mix(in srgb, var(--success-color) 10%, var(--rn-card)); border-color: color-mix(in srgb, var(--success-color) 40%, transparent); }
    .notice { padding: 0.75rem; border-radius: 10px; background: color-mix(in srgb, var(--warning-color) 12%, var(--rn-card)); border: 1px solid color-mix(in srgb, var(--warning-color) 40%, transparent); }
    .panel { border: 1px solid var(--divider-color); border-radius: 10px; padding: 1rem; }
    .panel-title { font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem; }
    .cat-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; padding: 0.625rem 0.75rem; border: 1px solid var(--divider-color); border-radius: 10px; margin-bottom: 0.5rem; }

    /* Drag'n'Drop im Release-Dialog */
    .drag-handle { cursor: grab; padding: 0 0.25rem; color: var(--secondary-text-color); -webkit-user-select: none; user-select: none; display: flex; align-items: center; font-size: 1rem; }
    .drag-handle:active { cursor: grabbing; }
    .item-card.dragging { opacity: 0.4; }
    .drop-zone.drag-over { background-color: color-mix(in srgb, var(--primary-color) 8%, transparent); outline: 2px dashed var(--primary-color); outline-offset: -4px; border-radius: 8px; }
    .item-card.drop-before { box-shadow: 0 -3px 0 0 var(--primary-color); }
    .item-card.drop-after { box-shadow: 0 3px 0 0 var(--primary-color); }

    @media (max-width: 600px) {
      .app { padding: 1rem; }
      .grid-cols-2 { grid-template-columns: 1fr; }
      .lbl { width: 6.5rem; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <div id="app" class="app">
    <div class="card">
      <div class="toolbar">
        <div class="header-title">

  <script>
// Kategorie-Farben: gespeichert wird nur die Farb-ID, das Aussehen je Theme steht im CSS (.lbl-<id>)
const CATEGORY_COLORS = [
  {id: 'white', label: 'Weiß'},
  {id: 'gray', label: 'Grau'},
  {id: 'black', label: 'Schwarz'},
  {id: 'red', label: 'Rot'},
  {id: 'orange', label: 'Orange'},
  {id: 'yellow', label: 'Gelb'},
  {id: 'green', label: 'Grün'},
  {id: 'blue-light', label: 'Hellblau'},
  {id: 'blue-dark', label: 'Dunkelblau'},
  {id: 'purple', label: 'Lila'},
  {id: 'pink', label: 'Pink'}
];
const COLOR_IDS = new Set(CATEGORY_COLORS.map(c => c.id));

// Bis v0.6.4 wurden Tailwind-Klassen gespeichert (z. B. 'bg-red-100 text-red-800',
// Backend-Standard 'bg-teal-500'). Bildet sie anhand des Farbtons auf eine Farb-ID ab.
const LEGACY_HUES = {white: 'white', gray: 'gray', slate: 'gray', zinc: 'gray', neutral: 'gray', stone: 'gray', black: 'black', red: 'red', rose: 'pink', orange: 'orange', amber: 'yellow', yellow: 'yellow', green: 'green', emerald: 'green', lime: 'green', teal: 'green', sky: 'blue-light', cyan: 'blue-light', indigo: 'blue-dark', violet: 'purple', purple: 'purple', fuchsia: 'pink', pink: 'pink'};
function toColorId(color) {
  if (COLOR_IDS.has(color)) return color;
  const m = /bg-([a-z]+)(?:-(\d+))?/.exec(color || '');
  if (!m) return 'gray';
  const hue = m[1], shade = parseInt(m[2] || '0', 10);
  if (hue === 'blue') return shade >= 500 ? 'blue-dark' : 'blue-light';
  if (hue === 'gray' && shade >= 700) return 'black';
  return LEGACY_HUES[hue] || 'gray';
}
// Gibt true zurück, wenn mindestens eine Kategorie umgestellt wurde
function normalizeCategoryColors() {
  let changed = false;
  state.categories = state.categories.map(c => {
    const id = toColorId(c.color);
    if (id === c.color) return c;
    console.log(`🎨 Migriere ${c.label}: ${c.color} → ${id}`);
    changed = true;
    return {...c, color: id};
  });
  return changed;
}
function lblClass(color) { return 'lbl-' + toColorId(color); }

// Theme: 'auto' übernimmt das aktive HA-Theme (die Seite läuft same-origin im iframe),
// außerhalb von HA die Systemeinstellung. 'light'/'dark' überschreiben beides.
const THEME_KEY = 'release_notes_theme';
const HA_THEME_VARS = ['primary-background-color', 'card-background-color', 'ha-card-background', 'ha-card-border-radius', 'ha-card-box-shadow', 'primary-text-color', 'secondary-text-color', 'divider-color', 'primary-color', 'text-primary-color', 'success-color', 'warning-color', 'error-color', 'info-color', 'primary-font-family'];
function getThemePref() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } }
function haParentRoot() {
  try { if (window.parent !== window && window.parent.document) return window.parent.document.documentElement; } catch (e) {}
  return null;
}
function isDarkColor(color) {
  const el = document.createElement('span');
  el.style.color = color;
  document.body.appendChild(el);
  const rgb = (getComputedStyle(el).color.match(/[\d.]+/g) || []).map(Number);
  el.remove();
  return rgb.length >= 3 && (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) < 128;
}
function haDarkMode(parentRoot, background) {
  try {
    const ha = parentRoot.ownerDocument.querySelector('home-assistant');
    const dark = ha && ha.hass && ha.hass.themes && ha.hass.themes.darkMode;
    if (typeof dark === 'boolean') return dark;
  } catch (e) {}
  return isDarkColor(background);
}
function applyTheme() {
  const root = document.documentElement;
  const pref = getThemePref();
  HA_THEME_VARS.forEach(v => root.style.removeProperty('--' + v));
  if (pref === 'light' || pref === 'dark') { root.dataset.theme = pref; return; }
  const parentRoot = haParentRoot();
  if (parentRoot) {
    const cs = getComputedStyle(parentRoot);
    const background = cs.getPropertyValue('--primary-background-color').trim();
    if (background) {
      HA_THEME_VARS.forEach(v => { const val = cs.getPropertyValue('--' + v).trim(); if (val) root.style.setProperty('--' + v, val); });
      root.dataset.theme = haDarkMode(parentRoot, background) ? 'dark' : 'light';
      return;
    }
  }
  delete root.dataset.theme;
}
function watchTheme() {
  const parentRoot = haParentRoot();
  if (parentRoot) {
    try { new MutationObserver(() => { if (getThemePref() === 'auto') applyTheme(); }).observe(parentRoot, {attributes: true, attributeFilter: ['style', 'class']}); } catch (e) {}
  }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getThemePref() === 'auto') applyTheme(); }); } catch (e) {}
}
function themeSwitchButtons() {
  const pref = getThemePref();
  return [['auto', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']]
    .map(([id, label]) => `<button type="button" aria-pressed="${pref === id}" onclick="setThemePref('${id}')">${label}</button>`).join('');
}
function setThemePref(pref) {
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
  applyTheme();
  document.querySelectorAll('[data-theme-switch]').forEach(el => { el.innerHTML = themeSwitchButtons(); });
}

const state={releases:[],knownIssues:[],categories:[{id:'general',label:'Allgemein',color:'gray'},{id:'heating',label:'Heizung',color:'orange'},{id:'energy',label:'Energie',color:'green'},{id:'automation',label:'Automation',color:'blue-dark'},{id:'device',label:'Gerät',color:'purple'},{id:'integration',label:'Integration',color:'pink'}],settings:{autoUpdateDocs:true},expandedReleases:new Set(),expandedDetails:new Set(),displayCount:10,searchTerm:'',filterCategory:'all',editingRelease:null,editingCatId:null,editingCatLabel:'',resolvingIssueId:null,resolvingSolution:'',resolveVersion:'',colorPickerCatId:null};
function formatDateDE(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}.${m}.${y}`}
async function loadData(){console.log('📥 Lade Daten...');try{const r=await fetch('/api/release_notes_manager/data?t='+Date.now());if(r.ok){const d=await r.json();console.log('✅ Geladen:',d);state.releases=d.releases||[];state.knownIssues=d.knownIssues||[];state.categories=d.categories||state.categories;state.settings=d.settings||state.settings;if(normalizeCategoryColors())saveData()}}catch(e){console.log('ℹ️ Erstmalige Nutzung')}render()}

async function saveData(){console.log('💾 Speichere...');setSaveStatus('Speichere...');const d={releases:state.releases,knownIssues:state.knownIssues,categories:state.categories,settings:state.settings,lastUpdate:new Date().toISOString()};try{const r=await fetch('/api/release_notes_manager/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:JSON.stringify(d)})});if(r.ok){console.log('✅ Gespeichert');setSaveStatus('✅ Gespeichert!');setTimeout(()=>setSaveStatus(''),3000);return true}throw new Error(`API ${r.status}`)}catch(e){console.error('❌ Fehler:',e);setSaveStatus('❌ Fehler!');alert(`Speichern fehlgeschlagen!\n\n${e.message}`);return false}}
function exportData(){const d={releases:state.releases,knownIssues:state.knownIssues,categories:state.categories,settings:state.settings,lastUpdate:new Date().toISOString()};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const stamp=new Date().toISOString().slice(0,10);a.href=url;a.download=`release-notes-export-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function handleImportFile(event){const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;const reader=new FileReader();reader.onload=async()=>{let d;try{d=JSON.parse(reader.result)}catch(e){alert(`Import fehlgeschlagen: Datei enthält kein gültiges JSON.\n\n${e.message}`);return}if(!d||!Array.isArray(d.releases)){alert('Import fehlgeschlagen: Datei enthält keine gültigen Release-Notes-Daten (Feld "releases" fehlt).');return}if(!confirm(`Import wird die aktuellen Daten vollständig ersetzen (${d.releases.length} Releases in der Datei).\n\nFortfahren?`))return;state.releases=d.releases;state.knownIssues=Array.isArray(d.knownIssues)?d.knownIssues:[];state.categories=Array.isArray(d.categories)&&d.categories.length>0?d.categories:state.categories;state.settings=d.settings&&typeof d.settings==='object'?d.settings:state.settings;normalizeCategoryColors();if(await saveData()){render()}};reader.onerror=()=>alert('Import fehlgeschlagen: Datei konnte nicht gelesen werden.');reader.readAsText(file)}
function setSaveStatus(t){document.getElementById('save-status').textContent=t}
function createNewRelease(){const today=new Date().toISOString().split('T')[0];const open=state.knownIssues.filter(i=>i.status!=='resolved');const inherited=open.map(i=>({...JSON.parse(JSON.stringify(i)),inheritedFrom:true}));console.log(`📋 Übernehme ${inherited.length} offene Fehler`);state.editingRelease={id:Date.now(),version:'',name:'',date:today,features:[],changes:[],knownIssues:inherited,comments:''};showModal('release')}
function rebuildKnownIssues(){const byId=new Map();const sorted=[...state.releases].sort((a,b)=>new Date(b.date)-new Date(a.date)||b.id-a.id);sorted.forEach(r=>{(r.knownIssues||[]).forEach(i=>{if(!byId.has(i.id))byId.set(i.id,i)})});state.knownIssues=Array.from(byId.values())}
async function saveRelease(){if(!state.editingRelease||!state.editingRelease.version){alert('Bitte Version eingeben!');return}state.editingRelease.knownIssues=state.editingRelease.knownIssues.map(i=>{const c={...i};delete c.inheritedFrom;return c});const isNew=!state.releases.find(r=>r.id===state.editingRelease.id);state.releases=isNew?[state.editingRelease,...state.releases]:state.releases.map(r=>r.id===state.editingRelease.id?state.editingRelease:r);rebuildKnownIssues();if(await saveData()){hideModal();state.editingRelease=null;render()}}
function editRelease(id){state.editingRelease=JSON.parse(JSON.stringify(state.releases.find(r=>r.id===id)));showModal('release')}
async function deleteRelease(id){if(!confirm('Release löschen?'))return;state.releases=state.releases.filter(r=>r.id!==id);await saveData();render()}
function deleteCurrentRelease(){
  if(!state.editingRelease){
    console.error('Kein Release zum Löschen');
    return;
  }
  if(confirm('⚠️ Release wirklich vollständig löschen?\n\nDiese Aktion kann nicht rückgängig gemacht werden!')){
    const id=state.editingRelease.id;
    deleteRelease(id);
    hideModal();
  }
}
function toggleRelease(id){state.expandedReleases.has(id)?state.expandedReleases.delete(id):state.expandedReleases.add(id);render()}
function toggleDetails(rid,type,iid){const k=rid+'-'+type+'-'+iid;state.expandedDetails.has(k)?state.expandedDetails.delete(k):state.expandedDetails.add(k);renderReleases()}function loadMore(){state.displayCount+=10;renderReleases()}

function addItem(t){state.editingRelease[t].unshift({id:Date.now(),title:'',details:'',category:'general'});renderModal()}
function updateItem(t,id,f,v){state.editingRelease[t]=state.editingRelease[t].map(i=>i.id===id?{...i,[f]:v}:i)}
function removeItem(t,id){state.editingRelease[t]=state.editingRelease[t].filter(i=>i.id!==id);renderModal()}

// Drag'n'Drop zum Verschieben von Einträgen zwischen "Neue Features" und "Änderungen/Bugfixes"
function handleDragStart(event,type,id){event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',JSON.stringify({type,id}));const card=event.currentTarget.closest('.item-card');if(card)card.classList.add('dragging')}
function handleDragEnd(event){const card=event.currentTarget.closest('.item-card');if(card)card.classList.remove('dragging')}
function handleDragOver(event){event.preventDefault();event.dataTransfer.dropEffect='move'}
function handleDragEnter(event){event.preventDefault();event.currentTarget.classList.add('drag-over')}
function handleDragLeave(event){if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('drag-over')}
function handleDrop(event,targetType){event.preventDefault();event.currentTarget.classList.remove('drag-over');let data;try{data=JSON.parse(event.dataTransfer.getData('text/plain'))}catch(e){return}if(!data||!data.type||data.type===targetType)return;moveItem(data.type,targetType,data.id)}
function moveItem(fromType,toType,id){const item=state.editingRelease[fromType].find(i=>i.id===id);if(!item)return;state.editingRelease[fromType]=state.editingRelease[fromType].filter(i=>i.id!==id);state.editingRelease[toType]=[item,...state.editingRelease[toType]];renderModal()}

// Umsortieren innerhalb eines Bereichs bzw. gezieltes Einfügen beim Verschieben:
// Drop direkt auf einer Karte fügt den Eintrag davor/danach ein (statt immer nur oben in die Zielliste)
function handleCardDragOver(event){event.preventDefault();event.stopPropagation();event.dataTransfer.dropEffect='move';const card=event.currentTarget;const rect=card.getBoundingClientRect();const before=(event.clientY-rect.top)<rect.height/2;card.classList.toggle('drop-before',before);card.classList.toggle('drop-after',!before)}
function handleCardDragLeave(event){event.currentTarget.classList.remove('drop-before','drop-after')}
function handleCardDrop(event,toType,referenceId){event.preventDefault();event.stopPropagation();const card=event.currentTarget;const insertAfter=card.classList.contains('drop-after');card.classList.remove('drop-before','drop-after');let data;try{data=JSON.parse(event.dataTransfer.getData('text/plain'))}catch(e){return}if(!data||!data.type||!data.id)return;if(data.type===toType&&data.id===referenceId)return;moveItemRelative(data.type,toType,data.id,referenceId,insertAfter)}
function moveItemRelative(fromType,toType,draggedId,referenceId,insertAfter){const item=state.editingRelease[fromType].find(i=>i.id===draggedId);if(!item)return;state.editingRelease[fromType]=state.editingRelease[fromType].filter(i=>i.id!==draggedId);const target=state.editingRelease[toType].slice();const refIndex=target.findIndex(i=>i.id===referenceId);const insertIndex=refIndex===-1?target.length:(insertAfter?refIndex+1:refIndex);target.splice(insertIndex,0,item);state.editingRelease[toType]=target;renderModal()}
function addKnownIssue(){state.editingRelease.knownIssues.unshift({id:Date.now(),title:'',details:'',category:'general',status:'open'});renderModal()}
function updateKnownIssue(id,f,v){state.editingRelease.knownIssues=state.editingRelease.knownIssues.map(i=>i.id===id?{...i,[f]:v}:i)}
function removeKnownIssue(id){state.editingRelease.knownIssues=state.editingRelease.knownIssues.filter(i=>i.id!==id);renderModal()}
function startResolveIssue(id){state.resolvingIssueId=id;state.resolvingSolution='';state.resolveVersion=state.editingRelease.version;renderModal()}
function confirmResolveIssue(){if(!state.resolvingIssueId)return;const issue=state.editingRelease.knownIssues.find(i=>i.id===state.resolvingIssueId);if(!issue)return;state.editingRelease.knownIssues=state.editingRelease.knownIssues.map(i=>i.id===state.resolvingIssueId?{...i,status:'resolved',resolvedInVersion:state.resolveVersion,resolution:state.resolvingSolution}:i);state.resolvingIssueId=null;state.resolvingSolution='';state.resolveVersion='';renderModal()}
function reopenIssue(id){state.editingRelease.knownIssues=state.editingRelease.knownIssues.map(i=>{if(i.id===id){const r={...i,status:'open'};delete r.resolvedInVersion;delete r.resolution;return r}return i});renderModal()}
function cancelResolveIssue(){state.resolvingIssueId=null;state.resolvingSolution='';state.resolveVersion='';renderModal()}
function showCategoriesManager(){showModal('categories')}
function showSettings(){showModal('settings')}
async function addCategory(){const l=document.getElementById('new-cat-input').value.trim();if(!l)return;const colors=['gray','orange'];state.categories.push({id:`custom_${Date.now()}`,label:l,color:colors[state.categories.length%colors.length]});await saveData();document.getElementById('new-cat-input').value='';renderModal()}
function startEditCat(id,l){state.editingCatId=id;state.editingCatLabel=l;renderModal()}
async function saveEditCat(){if(!state.editingCatLabel.trim())return;state.categories=state.categories.map(c=>c.id===state.editingCatId?{...c,label:state.editingCatLabel.trim()}:c);await saveData();state.editingCatId=null;state.editingCatLabel='';renderModal()}
function cancelEditCat(){state.editingCatId=null;state.editingCatLabel='';renderModal()}
async function deleteCategory(id){if(!confirm('Kategorie löschen?'))return;state.categories=state.categories.filter(c=>c.id!==id);await saveData();renderModal()}

// Farbauswahl klappt direkt unter der Kategorie im Dialog auf
function toggleColorPicker(catId){state.colorPickerCatId=state.colorPickerCatId===catId?null:catId;renderModal()}
function renderColorPicker(cat){const current=toColorId(cat.color);return`<div class="color-picker" role="group" aria-label="Farbe für ${esc(cat.label)}">${CATEGORY_COLORS.map(col=>`<button type="button" aria-pressed="${col.id===current}" title="${col.label}" onclick="selectColor('${cat.id}','${col.id}')"><span class="lbl lbl-${col.id}">${col.label}</span></button>`).join('')}</div>`}
function selectColor(catId, colorId) {
  state.categories = state.categories.map(c =>
    c.id === catId ? {...c, color: colorId} : c
  );
  state.colorPickerCatId = null;

function showModal(t){document.getElementById('modal').classList.add('active');document.getElementById('modal').dataset.type=t;renderModal()}

function renderCategoryFilter(){const s=document.getElementById('category-filter');s.innerHTML='<option value="all">Alle Kategorien</option>'+[...state.categories].sort((a,b)=>a.label.localeCompare(b.label,'de')).map(c=>`<option value="${c.id}" ${state.filterCategory===c.id?'selected':''}>${c.label}</option>`).join('')}
function renderReleases(){const allFiltered=state.releases.filter(r=>{const ms=!state.searchTerm||JSON.stringify(r).toLowerCase().includes(state.searchTerm.toLowerCase());const mc=state.filterCategory==='all'||r.features.some(f=>f.category===state.filterCategory)||r.changes.some(c=>c.category===state.filterCategory);return ms&&mc});const f=state.searchTerm?allFiltered:allFiltered.slice(0,state.displayCount);const c=document.getElementById('releases-container');const hasMore=!state.searchTerm&&allFiltered.length>state.displayCount;const newestId=newestReleaseId();c.innerHTML=f.length===0?'<div class="card empty"><p class="empty-title">Keine Releases</p><p>Erstelle dein erstes Release!</p></div>':f.map(r=>renderRelease(r,r.id===newestId)).join('')+(hasMore?'<div class="more"><button class="btn" onclick="loadMore()">Weitere Releases laden ('+((allFiltered.length-state.displayCount))+' verbleibend)</button></div>':'')}
// Neuestes Release nach Datum (gleiche Sortierung wie rebuildKnownIssues) - bekommt den Chip "Aktuell"
function newestReleaseId(){const sorted=[...state.releases].sort((a,b)=>new Date(b.date)-new Date(a.date)||b.id-a.id);return sorted.length?sorted[0].id:null}

function renderRelease(r,isNewest){ const exp=state.expandedReleases.has(r.id); const getCat=id=>state.categories.find(c=>c.id===id)||{label:id,color:'gray'}; const lbl=id=>{const cat=getCat(id||'general');return`<span class="lbl ${lblClass(cat.color)}">${esc(cat.label)}</span>`}; const open=(r.knownIssues||[]).filter(i=>i.status!=='resolved'); const resolved=(r.knownIssues||[]).filter(i=>i.status==='resolved'&&i.resolvedInVersion===r.version); const title=r.name?`Version ${esc(r.version)} - ${esc(r.name)}`:`Version ${esc(r.version)}`; const item=(type,i)=>{const isOpen=state.expandedDetails.has(r.id+'-'+type+'-'+i.id);const head=i.details?`<button type="button" class="item-toggle${isOpen?' open':''}" aria-expanded="${isOpen}" onclick="toggleDetails(${r.id},'${type}',${i.id})">${esc(i.title)}</button>`:`<div class="item-title">${esc(i.title)}</div>`;return`${lbl(i.category)}<div class="item-main">${head}${isOpen&&i.details?`<div class="item-details">${esc(i.details)}</div>`:''}</div>`}; const group=(heading,rows,cls='')=>`<div><h3 class="group-title">${heading}</h3><ul class="items${cls}">${rows}</ul></div>`; const body=(r.features&&r.features.length>0?group('Neue Features',r.features.map(f=>`<li class="item">${item('f',f)}</li>`).join('')):'')+(r.changes&&r.changes.length>0||resolved.length>0?group('Änderungen / Bugfixes',r.changes.map(c=>`<li class="item">${item('c',c)}</li>`).join('')+resolved.map(i=>`<li class="item">${lbl(i.category)}<div class="item-main"><div class="item-title">${esc(i.title)}</div><div class="chips"><span class="chip chip-done">Gelöst in ${esc(r.version)}</span></div>${i.resolution?`<div class="item-resolution">${esc(i.resolution)}</div>`:''}</div></li>`).join('')):'')+(open.length>0?group('Bekannte Fehler',open.map(i=>`<li class="item issue">${item('i',i)}</li>`).join(''),' issues'):'')+(r.comments?`<div class="note">${esc(r.comments)}</div>`:''); return`<div class="card release${exp?' open':''}"><div class="release-head" role="button" tabindex="0" aria-expanded="${exp}" onclick="toggleRelease(${r.id})" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();toggleRelease(${r.id})}"><div class="release-title-row"><h2 class="release-title">${title}</h2><div class="release-meta"><span class="release-date">${formatDateDE(r.date)}</span><button type="button" class="btn-icon" onclick="event.stopPropagation();editRelease(${r.id})" title="Release bearbeiten" aria-label="Release bearbeiten"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></svg></button></div></div><div class="chips">${isNewest?'<span class="chip chip-now">Aktuell</span>':''}${getSummaryBadges(r)}</div></div>${exp?`<div class="release-body">${body}</div>`:''}</div>` }

function renderModal(){const m=document.getElementById('modal');const c=m.querySelector('.modal-content');const t=m.dataset.type;if(t==='categories'){c.innerHTML=`<div class="flex justify-between items-center mb-6"><h2 class="dialog-title">Kategorien verwalten</h2><button class="btn" onclick="hideModal()">Schließen</button></div><div class="mb-6"><label class="block text-sm font-medium mb-2">Neue Kategorie</label><div class="flex gap-2"><input type="text" id="new-cat-input" placeholder="Name..." class="flex-1 px-3 py-2 rounded" onkeypress="if(event.key==='Enter')addCategory()"/><button class="btn btn-primary" onclick="addCategory()">+ Hinzufügen</button></div></div>${[...state.categories].sort((a,b)=>a.label.localeCompare(b.label,'de')).map(c=>state.editingCatId===c.id?`<div class="cat-row"><input type="text" value="${escInput(state.editingCatLabel)}" oninput="state.editingCatLabel=this.value" class="flex-1 px-2 py-1 rounded" onkeypress="if(event.key==='Enter')saveEditCat()"/><button class="btn btn-sm btn-primary" onclick="saveEditCat()">Speichern</button><button class="btn btn-sm" onclick="cancelEditCat()">Abbrechen</button></div>`:`<div class="cat-row"><span class="lbl ${lblClass(c.color)} lbl-pick" role="button" tabindex="0" aria-expanded="${state.colorPickerCatId===c.id}" onclick="toggleColorPicker('${c.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleColorPicker('${c.id}')}" title="Klicken um Farbe zu ändern">${esc(c.label)}</span><div class="flex gap-2"><button class="btn btn-sm" onclick="startEditCat('${c.id}','${esc(c.label)}')">Name ändern</button><button class="btn btn-sm btn-danger" onclick="deleteCategory('${c.id}')">Löschen</button></div></div>${state.colorPickerCatId===c.id?renderColorPicker(c):''}`).join('')}`}else if(t==='release'&&state.editingRelease){const r=state.editingRelease;const isNew=!state.releases.find(rel=>rel.id===r.id);const inherited=r.knownIssues.filter(i=>i.inheritedFrom).length;c.innerHTML=`<div class="flex justify-between items-center mb-6"><h2 class="dialog-title">${isNew?'Neues Release':'Release bearbeiten'}</h2><div class="flex gap-2"><button class="btn" onclick="hideModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveRelease()">Speichern</button></div></div>${isNew&&inherited>0?`<div class="notice mb-4"><p class="text-sm"><strong>${inherited} offene${inherited===1?'r Fehler wurde':' Fehler wurden'} automatisch übernommen</strong></p></div>`:''}<div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-sm font-medium mb-2">Version *</label><input type="text" value="${escInput(r.version)}" oninput="state.editingRelease.version=this.value" class="w-full px-3 py-2 rounded" placeholder="z.B. 2025.1.1"/></div><div><label class="block text-sm font-medium mb-2">Name (optional)</label><input type="text" value="${escInput(r.name||'')}" oninput="state.editingRelease.name=this.value" class="w-full px-3 py-2 rounded" placeholder="z.B. Stable Release"/></div></div><div class="mb-4"><label class="block text-sm font-medium mb-2">Datum</label><input type="date" value="${r.date}" oninput="state.editingRelease.date=this.value" class="w-full px-3 py-2 rounded"/></div><div class="border-t pt-4 mb-4 drop-zone" ondragover="handleDragOver(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'features')"><div class="flex justify-between mb-3"><h3 class="section-title">Neue Features</h3><button class="btn btn-sm" onclick="addItem('features')">+ Hinzufügen</button></div>${r.features.map(f=>`<div class="edit-row item-card" ondragover="handleCardDragOver(event)" ondragleave="handleCardDragLeave(event)" ondrop="handleCardDrop(event,'features',${f.id})"><div class="flex gap-2 mb-2"><span class="drag-handle" draggable="true" ondragstart="handleDragStart(event,'features',${f.id})" ondragend="handleDragEnd(event)" title="Verschieben">⠿</span><input type="text" value="${escInput(f.title)}" oninput="updateItem('features',${f.id},'title',this.value)" placeholder="Titel..." class="flex-1 px-2 py-1 rounded"/><select onchange="updateItem('features',${f.id},'category',this.value)" class="px-2 py-1 rounded">${[...state.categories].sort((a,b)=>a.label.localeCompare(b.label,'de')).map(c=>`<option value="${c.id}" ${f.category===c.id?'selected':''}>${c.label}</option>`).join('')}</select><button class="btn-icon btn-icon-danger" title="Entfernen" aria-label="Entfernen" onclick="removeItem('features',${f.id})">×</button></div><textarea oninput="updateItem('features',${f.id},'details',this.value)" placeholder="Details..." class="w-full px-2 py-1 rounded" rows="3">${escInput(f.details||'')}</textarea></div>`).join('')}${r.features.length===0?'<p class="text-gray-500 italic">Keine Features</p>':''}</div><div class="border-t pt-4 mb-4 drop-zone" ondragover="handleDragOver(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'changes')"><div class="flex justify-between mb-3"><h3 class="section-title">Änderungen / Bugfixes</h3><button class="btn btn-sm" onclick="addItem('changes')">+ Hinzufügen</button></div>${r.changes.map(c=>`<div class="edit-row item-card" ondragover="handleCardDragOver(event)" ondragleave="handleCardDragLeave(event)" ondrop="handleCardDrop(event,'changes',${c.id})"><div class="flex gap-2 mb-2"><span class="drag-handle" draggable="true" ondragstart="handleDragStart(event,'changes',${c.id})" ondragend="handleDragEnd(event)" title="Verschieben">⠿</span><input type="text" value="${escInput(c.title)}" oninput="updateItem('changes',${c.id},'title',this.value)" placeholder="Titel..." class="flex-1 px-2 py-1 rounded"/><select onchange="updateItem('changes',${c.id},'category',this.value)" class="px-2 py-1 rounded">${[...state.categories].sort((a,b)=>a.label.localeCompare(b.label,'de')).map(cat=>`<option value="${cat.id}" ${c.category===cat.id?'selected':''}>${cat.label}</option>`).join('')}</select><button class="btn-icon btn-icon-danger" title="Entfernen" aria-label="Entfernen" onclick="removeItem('changes',${c.id})">×</button></div><textarea oninput="updateItem('changes',${c.id},'details',this.value)" placeholder="Details..." class="w-full px-2 py-1 rounded" rows="3">${escInput(c.details||'')}</textarea></div>`).join('')}${r.changes.length===0?'<p class="text-gray-500 italic">Keine Änderungen</p>':''}</div><div class="border-t pt-4 mb-4"><div class="flex justify-between mb-3"><h3 class="section-title">Bekannte Fehler</h3><button class="btn btn-sm" onclick="addKnownIssue()">+ Hinzufügen</button></div>${r.knownIssues.map(i=>state.resolvingIssueId===i.id?`<div class="space-y-3"><div class="edit-row edit-row-done"><h4 class="font-semibold text-green-800 mb-2">✓ Fehler als gelöst markieren</h4><p class="text-sm text-green-700 mb-3">Fehler: <strong>${esc(i.title)}</strong></p><div class="space-y-2"><label class="block text-sm font-medium text-gray-700">In Version gelöst (optional):</label><input type="text" value="${escInput(state.resolveVersion)}" oninput="state.resolveVersion=this.value" placeholder="${r.version}" class="w-full px-3 py-2 border rounded"/><label class="block text-sm font-medium text-gray-700 mt-3">Beschreibung der Lösung (optional):</label><textarea oninput="state.resolvingSolution=this.value" placeholder="Beschreibe wie der Fehler gelöst wurde..." class="w-full px-3 py-2 border rounded" rows="3">${escInput(state.resolvingSolution)}</textarea></div><div class="flex gap-2 mt-3"><button class="btn btn-primary" onclick="confirmResolveIssue()">${state.resolvingSolution.trim()?'Lösung dokumentieren':'Als gelöst markieren'}</button><button class="btn" onclick="cancelResolveIssue()">Abbrechen</button></div></div></div>`:i.status==='resolved'?`<div class="edit-row edit-row-done"><div class="flex gap-2 mb-2 items-start"><span class="chip chip-done">✓ Gelöst in ${esc(i.resolvedInVersion||'?')}</span><div class="flex-1"><div class="font-medium text-gray-600 line-through">${esc(i.title)}</div>${i.resolution?`<p class="text-sm text-gray-600">${esc(i.resolution)}</p>`:''}</div><button class="btn btn-sm" onclick="reopenIssue(${i.id})" title="Fehler wieder öffnen">Wieder öffnen</button></div></div>`:`<div class="edit-row edit-row-issue"><div class="flex gap-2 mb-2"><input type="text" value="${escInput(i.title)}" oninput="updateKnownIssue(${i.id},'title',this.value)" placeholder="Fehler..." class="flex-1 px-2 py-1 rounded"/><select onchange="updateKnownIssue(${i.id},'category',this.value)" class="px-2 py-1 rounded">${[...state.categories].sort((a,b)=>a.label.localeCompare(b.label,'de')).map(cat=>`<option value="${cat.id}" ${(i.category||'general')===cat.id?'selected':''}>${cat.label}</option>`).join('')}</select><button class="btn btn-sm btn-success" onclick="startResolveIssue(${i.id})" title="Als gelöst markieren">✓ Gelöst</button><button class="btn-icon btn-icon-danger" title="Entfernen" aria-label="Entfernen" onclick="removeKnownIssue(${i.id})">×</button></div><textarea oninput="updateKnownIssue(${i.id},'details',this.value)" placeholder="Details..." class="w-full px-2 py-1 rounded" rows="2">${escInput(i.details||'')}</textarea></div>`).join('')}${r.knownIssues.length===0?'<p class="text-gray-500 italic">Keine bekannten Fehler</p>':''}</div><div class="border-t pt-4"><label class="block text-sm font-medium mb-2">Kommentare (optional)</label><textarea oninput="state.editingRelease.comments=this.value" class="w-full px-3 py-2 rounded" rows="3" placeholder="Zusätzliche Informationen...">${escInput(r.comments||'')}</textarea></div><div class="border-t pt-4 mt-4 flex justify-end"><button class="btn btn-danger" onclick="deleteCurrentRelease()">Release vollständig löschen</button></div>`}else if(t==='settings'){c.innerHTML=`<div class="flex justify-between items-center mb-6"><h2 class="dialog-title">Einstellungen</h2><button class="btn" onclick="hideModal()">Schließen</button></div><div class="panel mb-4"><h3 class="panel-title">Darstellung</h3><p class="text-sm text-gray-600 mb-3">„Automatisch“ übernimmt das aktive Home-Assistant-Theme, außerhalb von Home Assistant die Systemeinstellung.</p><div class="seg" role="group" aria-label="Darstellung" data-theme-switch>${themeSwitchButtons()}</div></div><div class="panel mb-4"><h3 class="panel-title">Automatische Update-Dokumentation</h3><p class="text-sm text-gray-600 mb-3">Erstellt automatisch Release-Notes-Einträge, wenn Home-Assistant-Update-Entitäten ein Update abschließen oder neu hinzukommen/verschwinden.</p><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${state.settings.autoUpdateDocs?'checked':''} onchange="toggleAutoUpdateDocs(this.checked)"/><span class="text-sm">Automatische Update-Dokumentation aktiviert</span></label></div><div class="panel mb-4"><h3 class="panel-title">Daten</h3><p class="text-sm text-gray-600 mb-3">Datenstand sichern oder aus einer Sicherung wiederherstellen.</p><div class="flex gap-2"><button class="btn" onclick="exportData()">Exportieren</button><button class="btn" onclick="document.getElementById('import-file-input').click()">Importieren</button></div></div>`}}
async function toggleAutoUpdateDocs(enabled){state.settings.autoUpdateDocs=enabled;await saveData()}
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML.replace(/\n/g,'<br>')}
// Für editierbare Felder (value=""/<textarea>): NICHT \n->br wandeln, sonst
// erscheint bei jedem erneuten Öffnen literal "<br>" im Eingabefeld statt
// eines echten Zeilenumbruchs.
function escInput(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
function getSummaryBadges(r) {
  const featCount = r.features?.length || 0;

  // Zähle Änderungen + gelöste Fehler in dieser Version
  const changesCount = r.changes?.length || 0;
  const resolvedInThisVersion = (r.knownIssues || []).filter(
    i => i.status === 'resolved' && i.resolvedInVersion === r.version
  ).length;
  const changeCount = changesCount + resolvedInThisVersion;

  const issueCount = (r.knownIssues || []).filter(i => i.status !== 'resolved').length;

  const chip = (cls, count, label) => '<span class="chip ' + cls + '"><span class="chip-dot"></span>' + count + ' ' + label + '</span>';
  const badges = [];
  if (featCount > 0) badges.push(chip('chip-features', featCount, featCount === 1 ? 'Feature' : 'Features'));
  if (changeCount > 0) badges.push(chip('chip-changes', changeCount, changeCount === 1 ? 'Änderung' : 'Änderungen'));
  if (issueCount > 0) badges.push(chip('chip-issues', issueCount, 'Fehler'));
  return badges.join('');
}
applyTheme();
watchTheme();
document.querySelectorAll('[data-theme-switch]').forEach(el => { el.innerHTML = themeSwitchButtons(); });
document.getElementById('search-input').addEventListener('input',e=>{state.searchTerm=e.target.value;render()});
document.getElementById('category-filter').addEventListener('change',e=>{state.filterCategory=e.target.value;render()});
// Einzige Quelle für die Admin-Version dieser Datei. Nur erhöhen, wenn an
// DIESER Datei etwas geändert wurde (unabhängig von der Backend-Version).
const ADMIN_VERSION = '0.7.0';
document.title = 'Home Assistant Release Notes Manager - Admin v' + ADMIN_VERSION;
document.getElementById('version-meta').setAttribute('content', ADMIN_VERSION);
console.log('🚀 Home Assistant Release Notes Manager (Admin v' + ADMIN_VERSION + ') startet...');

// Auto-Reload bei Version-Mismatch (v0.5.1+)
async function checkVersionAndReload() {
  try {
    const STORAGE_KEY = 'release_notes_admin_version_reloaded';

    // Hole aktuelle Versionen vom Backend
    const response = await fetch('/api/release_notes_manager/version?t=' + Date.now());
    if (!response.ok) return; // API nicht verfügbar, überspringe Check

    const data = await response.json();
    const backendVersion = data.backend;
    const adminVersion = data.admin;

    document.getElementById('version-footer').textContent =
      'Backend: v' + backendVersion + ' | Admin: v' + ADMIN_VERSION;

    // Prüfe ob wir bereits für diese Admin-Version reloadet haben
    const lastReloadedVersion = localStorage.getItem(STORAGE_KEY);

    if (adminVersion !== ADMIN_VERSION && lastReloadedVersion !== adminVersion) {
      console.log('🔄 Version-Mismatch erkannt (Server meldet Admin v' + adminVersion + ', geladen ist v' + ADMIN_VERSION + ') - Reload...');
      localStorage.setItem(STORAGE_KEY, adminVersion);

      // Reload nach kurzer Verzögerung
      setTimeout(() => {
        window.location.reload();
      }, 500);
      return true; // Reload wird durchgeführt
    }

    // Versionen stimmen überein oder wurde bereits reloadet
    console.log('✅ Admin-Version aktuell (' + ADMIN_VERSION + ')');
    return false;
  } catch (error) {
    console.error('⚠️ Version-Check fehlgeschlagen:', error);
    return false;
  }
}

// Führe Version-Check durch, dann lade Daten
checkVersionAndReload().then(reloading => {
  if (!reloading) {
    loadData();
  }
});
  </script>

  <!-- Versions-Anzeige -->
  <div id="version-footer" class="version-footer">
    Admin: v0.7.0
  </div>
